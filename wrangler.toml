name = "chatlustora"
main = "src/worker/index.ts"
compatibility_date = "2026-10-17"

[assets]
directory = "./dist/"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/healthz"]
[[d1_databases]]
binding = "DB"
database_name = "chatlustora-db"
database_id = "PLACEHOLDER_D1_ID"

[env.production]
[[env.production.migrations]]
tag = "v1"
new_classes = ["RoomDO", "CoordinatorDO"]

[env.staging]
name = "chatlustora-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "chatlustora-staging-db"
database_id = "b5de7d6e-d425-443b-95f7-414c224445fd"


[[env.staging.migrations]]
tag = "v1-staging"
new_sqlite_classes = ["RoomDO", "CoordinatorDO"]


[env.staging.durable_objects]
bindings = [
  { name = "ROOMS", class_name = "RoomDO" },
  { name = "COORDINATOR", class_name = "CoordinatorDO" }
]
